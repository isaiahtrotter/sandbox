<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sandbox</title>
  <link rel="stylesheet" href="styles.css">
  <script>
    // Applied before first paint so a stored theme doesn't flash the wrong colors.
    try {
      var saved = localStorage.getItem('sandbox-theme');
      if (saved) document.documentElement.dataset.theme = saved;
    } catch (e) {}
  </script>
</head>
<body>
  <main>
    <header>
      <h1>Sandbox</h1>
      <button id="theme-toggle" class="theme-toggle" type="button">
        <span aria-hidden="true"></span>
      </button>
    </header>

    <p class="lede">A scratch space for experiments. Edit these three files and reload.</p>

    <section class="demo">
      <button id="counter" type="button">Clicked <span id="count">0</span> times</button>
    </section>

    <footer>
      <code>index.html</code> &middot; <code>styles.css</code> &middot; <code>main.js</code>
    </footer>
  </main>

  <script src="main.js"></script>
</body>
</html>
